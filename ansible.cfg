# ansible.cfg — complete timeout configuration
[defaults]
timeout = 30
gather_timeout = 30

[ssh_connection]
ssh_args = -o ServerAliveInterval=30 -o ControlMaster=auto -o ControlPersist=60s
pipelining = true
retries = 3

[persistent_connection]
connect_timeout = 60
command_timeout = 60
connect_retry_timeout = 15
