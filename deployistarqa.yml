---
- hosts: all
  become: false
  become_method: sudo
  gather_facts: false
  name: deployistarqa.yml
  vars:
    slack_token: "{{ lookup('env', 'SLACK_TOKEN') }}"
    current_distro_name: "{{ lookup('env', 'DISTRO_NAME') }}"
  pre_tasks:
    - name: Connection Checks
      ansible.builtin.include_role:
        name: connection-check
      vars:
        distro_name: "{{ current_distro_name }}"
  tasks:
  #Prune old images and docker compose down the existing services
  
    - name: Prune old images
      ansible.builtin.shell: docker system prune -af --volumes
      args:
        executable: /bin/bash
  
    - name: Pause for 10 seconds to ensure execution order
      ansible.builtin.pause:
        seconds: 10

    - name: Docker compose down
      ansible.builtin.shell: cd QAISTAR && docker compose down
      args:
        executable: /bin/bash

    - name: Pause for 10 seconds to ensure execution order
      ansible.builtin.pause:
        seconds: 10
  #Update Image tag
    - name: Update Image Tag
      ansible.builtin.shell: cd QAISTAR && sed -i 's/^TAG=.*$/TAG={{ TAG }}/' .env
      args:
        executable: /bin/bash
  #Login to ECR and pull frontend image
    - name: Login to ECR (Frontend) 
      ansible.builtin.shell: aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 387962842595.dkr.ecr.us-east-2.amazonaws.com/betaflix/bits-lms-frontend
      args:
        executable: /bin/bash

    - name: Pause for 1 second to ensure execution order
      ansible.builtin.pause:
        seconds: 1

    - name: Pull image (Frontend) 
      ansible.builtin.shell: cd QAISTAR && docker compose pull istar-frontend
      args:
        executable: /bin/bash
        
    - name: Pause for 10 seconds to ensure execution order
      ansible.builtin.pause:
        seconds: 10
  #Login to ECR and pull backend image
    - name: Login to ECR (backend)
      ansible.builtin.shell: aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 387962842595.dkr.ecr.us-east-2.amazonaws.com/betaflix/bits-istar-frontend
      args:
        executable: /bin/bash

    - name: Pause for 1 second to ensure execution order
      ansible.builtin.pause:
        seconds: 1

    - name: Pull image (backend)
      ansible.builtin.shell: cd QAISTAR && docker compose pull istar-backend
      args:
        executable: /bin/bash

    - name: Pause for 10 seconds to ensure execution order
      ansible.builtin.pause:
        seconds: 10
  #Login to ECR and pull Autograder Image
    - name: Login to ECR (Autograder) 
      ansible.builtin.shell: aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 387962842595.dkr.ecr.us-east-2.amazonaws.com/betaflix/bits-lms-autograder
      args:
        executable: /bin/bash

    - name: Pause for 1 second to ensure execution order
      ansible.builtin.pause:
        seconds: 1

    - name: Pull image (Autograder) 
      ansible.builtin.shell: cd QAISTAR && docker compose pull istar-autograder
      args:
        executable: /bin/bash
        
    - name: Pause for 10 seconds to ensure execution order
      ansible.builtin.pause:
        seconds: 10
  #Releauch service
    - name: Docker compose up
      ansible.builtin.shell: cd QAISTAR && docker compose up -d
      args:
        executable: /bin/bash

    - name: Pause for 1 second to ensure execution order
      ansible.builtin.pause:
        seconds: 1
  #Message Devs
    - name: 1 Task 1
      block:
        - name: 1-0 Task 1
          ansible.builtin.include_role:
            name: qa-notifications
          timeout: 300
      rescue:
        - name: 1F-0 Send failure alert to Slack
          community.general.slack:
            token: "{{ slack_token }}"
            channel: "{{ slack_channel }}"
            msg: |
              🚨 *Playbook Failed!*
              *Host:* {{ inventory_hostname }}
              *Failed Task:* {{ ansible_failed_task.name }}
              *Failed Playbook:* {{ ansible_play_name }}
              *Failure Message:* ```{{ ansible_failed_result }}```
        - name: 1F-1 End playbook execution after alert
          ansible.builtin.fail:
            msg: "Playbook execution stopped due to a failure."
