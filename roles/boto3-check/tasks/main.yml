---
- name: test if boto3 is installed
  block:
    - name: Check if Pip is installed
      ansible.builtin.include_role:
        name: pip-check
        
    - name: Check if boto3 is installed via shell
      shell: pip show boto3
      register: boto3_check
      changed_when: false
      ignore_errors: true
      
    - name: install boto3 if not installed
      ansible.builtin.pip:
        name:
          - boto3
          - botocore
        break_system_packages: true
      when: boto3_check.rc != 0
  rescue:
    - name: PRQF-1 Send failure alert
      ansible.builtin.include_role:
        name: error-alert
