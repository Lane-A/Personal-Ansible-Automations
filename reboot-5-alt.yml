---
- hosts: all
  become: true
  become_method: sudo
  gather_facts: false
  name: reboot-5-alt.yml
          
  tasks:
      - name: 1 Schedule a reboot for 5 minutes from now
        block:
          - name: 1-0 Schedule a reboot for 5 minutes from now
            ansible.builtin.shell: "shutdown -r +5"
            async: 30
            poll: 5
            ignore_errors: true
            timeout: 300
        rescue:
          - name: 1F-0 Send failure alert
            ansible.builtin.include_role:
              name: error-alert
