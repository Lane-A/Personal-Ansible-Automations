name: Clone Repo Daily

on:
  schedule:
    # 💡 Tip: You must quote the cron string because * is a special character in YAML
    - cron: '0 6 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running manually'
        required: false
        default: 'Routine check'

jobs:
  mirror-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo with token
        run: |
          git clone https://${{ secrets.PAT }}@://github.com/BetaFlix-Global/Operations-Ansible-Playbooks.git
          cd target-repo
          # Make your file updates here
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update repository files"
          git push origin main
