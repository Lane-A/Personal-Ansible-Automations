name: Clone Repo Daily

on:
  schedule:
    # 💡 Tip: You must quote the cron string because * is a special character in YAML
    - cron: '0 6 * * *'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running manually'
        required: false
        default: 'Routine check'

jobs:
  mirror-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          path: 'target-dir'
          
      - name: Clone repo with token
        run: |
          ls -a
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/BetaFlix-Global/Operations-Ansible-Playbooks.git source-dir 
          ls -a
          cd source-dir
          ls -a
          # Make your file updates here
          rm -rf .git
          ls -a
          cd ..
          ls -a
          cp -a ./source-dir. ./target-dir
          ls -a
          cd target-dir
          ls -a
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update repository files"
          git push origin main
