---
- hosts: all
  become: false
  tasks:
    #remove old images and docker compose down
    - name: Prune old images
      ansible.builtin.shell: docker system prune -af --volumes
      args:
        executable: /bin/bash
  
    - name: Pause for 10 seconds to ensure execution order
      ansible.builtin.pause:
        seconds: 10

    - name: Docker compose down
      ansible.builtin.shell: cd BEISTAR && docker compose down
      args:
        executable: /bin/bash

    - name: Pause for 10 seconds to ensure execution order
      ansible.builtin.pause:
        seconds: 10
    #Update Image Tag
    - name: Update Image Tag
      ansible.builtin.shell: cd BEISTAR && sed -i 's/^TAG=.*$/TAG={{ TAG }}/' .env
      args:
        executable: /bin/bash
    #Login to ECR and pull frontend image
    - name: Login to ECR (Frontend) 
      ansible.builtin.shell: aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 387962842595.dkr.ecr.us-east-2.amazonaws.com/betaflix/bits-lms-frontend
      args:
        executable: /bin/bash

    - name: Pause for 1 second to ensure execution order
      ansible.builtin.pause:
        seconds: 1

    - name: Pull image (Frontend) 
      ansible.builtin.shell: cd BEISTAR && docker compose pull istar-frontend
      args:
        executable: /bin/bash
        
    - name: Pause for 10 seconds to ensure execution order
      ansible.builtin.pause:
        seconds: 10
    #Login to ECR and pull backend image
    - name: Login to ECR (backend)
      ansible.builtin.shell: aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 387962842595.dkr.ecr.us-east-2.amazonaws.com/betaflix/bits-istar-frontend
      args:
        executable: /bin/bash

    - name: Pause for 1 second to ensure execution order
      ansible.builtin.pause:
        seconds: 1

    - name: Pull image (backend)
      ansible.builtin.shell: cd BEISTAR && docker compose pull istar-backend
      args:
        executable: /bin/bash

    - name: Pause for 10 seconds to ensure execution order
      ansible.builtin.pause:
        seconds: 10
     #Login to ECR and pull Autograder Image
    - name: Login to ECR (Autograder) 
      ansible.builtin.shell: aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 387962842595.dkr.ecr.us-east-2.amazonaws.com/betaflix/bits-lms-autograder
      args:
        executable: /bin/bash

    - name: Pause for 1 second to ensure execution order
      ansible.builtin.pause:
        seconds: 1

    - name: Pull image (Autograder) 
      ansible.builtin.shell: cd QAISTAR && docker compose pull istar-autograder
      args:
        executable: /bin/bash
        
    - name: Pause for 10 seconds to ensure execution order
      ansible.builtin.pause:
        seconds: 10
    #Launch Services
    - name: Docker compose up
      ansible.builtin.shell: cd BEISTAR && docker compose up -d
      args:
        executable: /bin/bash

    - name: Pause for 1 second to ensure execution order
      ansible.builtin.pause:
        seconds: 1
    #Message Devs
    - name: message devs
      ansible.builtin.uri: 
        url: 'https://hooks.slack.com/services/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'
        method: POST
        body_format: json
        body: {"text": "<!channel> iStar Deployed to staging: https://sim-istar.org/", "username": "Autodeployments", "icon_emoji" : ":zap:"}
        headers:
          Content-Type: application/json

    - name: Pause for 10 seconds to ensure execution order
      ansible.builtin.pause:
        seconds: 10
