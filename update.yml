---
- hosts: all
  become: true
  become_method: "{{ lookup('env', 'DISTRO_BECOME_METHOD') }}"
  gather_facts: false
  name: update.yml
  vars:
    current_distro_name: "{{ lookup('env', 'DISTRO_NAME') }}"
      
  pre_tasks:
    - name: Connection Checks
      ansible.builtin.include_role:
        name: connection-check
      vars:
        distro_name: "{{ current_distro_name }}"
          
  tasks:
      - name: 1 Upgrade the OS (apt-get dist-upgrade)
        block:
          - name: 1-0 Upgrade the OS (apt-get dist-upgrade)
            ansible.builtin.apt:
              update_cache: yes
              upgrade: dist
            async: 300
            poll: 30
            timeout: 300
        when: current_distro_name == "Ubuntu" or current_distro_name == "Debian"
        rescue:
          - name: 1F-0 Send failure alert
            ansible.builtin.include_role:
              name: error-alert
      
      - name: 1 Update all packages to their latest version
        block:
          - name: 1-0 Update all packages to their latest version
            community.general.apk:
              update_cache: true
              upgrade: true
            register: apk_upgrade
        when: current_distro_name == "Alpine"
        rescue:
          - name: 1F-0 Send failure alert
            ansible.builtin.include_role:
              name: error-alert

      - name: 1 Update all packages to their latest version
        block:
          - name: Apply latest package updates
            ansible.builtin.dnf:
              name: "*"
              state: latest
              update_cache: true
            async: 300
            poll: 30
            timeout: 300
        when: current_distro_name == "RHEL"
        rescue:
          - name: 1F-0 Send failure alert
            ansible.builtin.include_role:
              name: error-alert

      - name: Unsupported Distro
        ansible.builtin.fail:
          msg: "Unsupported Distro"
        when: current_distro_name != "Ubuntu" and current_distro_name != "Debian" and current_distro_name != "Alpine" and current_distro_name != "RHEL"
