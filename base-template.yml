---
- hosts: all
  become: true
  become_method: sudo
  gather_facts: false
  name: base-template.yml
  vars:
    slack_token: "{{ lookup('env', 'SLACK_TOKEN') }}"
    current_distro_name: "{{ lookup('env', 'DISTRO_NAME') }}"
    
  pre_tasks:
    - name: Connection Checks
      ansible.builtin.include_role:
        name: connection-check
      vars:
        distro_name: "{{ current_distro_name }}"
  tasks:
    - name: 1 Task 1
      block:
        - name: 1-0 Task 1
          ansible.builtin.shell: echo command
          args:
            executable: /bin/bash
          timeout: 300
      rescue:
        - name: 1F-0 Send failure alert to Slack
          community.general.slack:
            token: "{{ slack_token }}"
            channel: "{{ slack_channel }}"
            msg: |
              🚨 *Playbook Failed!*
              *Host:* {{ inventory_hostname }}
              *Failed Task:* {{ ansible_failed_task.name }}
              *Failed Playbook:* {{ ansible_play_name }}
              *Failure Message:* ```{{ ansible_failed_result }}```
        - name: 1F-1 End playbook execution after alert
          ansible.builtin.fail:
            msg: "Playbook execution stopped due to a failure."
