---
- hosts: all
  become: false
  gather_facts: false
  vars:
    current_distro_name: "{{ lookup('env', 'DISTRO_NAME') }}"
  pre_tasks:
    - name: Connection Checks
      ansible.builtin.include_role:
        name: connection-check
      vars:
        distro_name: "{{ current_distro_name }}"
  tasks:
    - name: 1 Upgrade the OS (apt-get dist-upgrade)
      block:
        - name: 1-0 Upgrade the OS (apt-get dist-upgrade)
          ansible.builtin.command: /bin/false
      rescue:
        - name: 1F-0 Send failure alert to Slack
          ansible.builtin.include_role:
            name: error-alert
          vars: 
            service_name: "{{ playbook_service_name }}"
            
