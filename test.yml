---
- hosts: all
  become: true
  become_method: sudo
  gather_facts: false
  name: base-template.yml
  vars:
    current_distro_name: "{{ lookup('env', 'DISTRO_NAME') }}"
    current_service_name: "{{ lookup('env', 'SERVICE_NAME') }}"
    
  pre_tasks:
    - name: Connection Checks
      ansible.builtin.include_role:
        name: connection-check
      vars:
        distro_name: "{{ current_distro_name }}"
    - name: Boto3 Checks
      ansible.builtin.include_role:
        name: boto3-check
      vars:
        distro_name: "{{ current_distro_name }}"
  tasks:
    - name: Task 1 Get Temporary Credentials
      block:
        - name: Task 1
          amazon.aws.sts_assume_role:
            access_key: AKIA1EXAMPLE1EXAMPLE
            secret_key: 123456789abcdefghijklmnopqrstuvwxyzABCDE
            role_arn: "arn:aws:iam::123456789012:role/someRole"
            role_session_name: "someRoleSession"
          register: assumed_role
          delegate_to: localhost
          become: false
      rescue:
        - name: Task 1 Send failure alert
          ansible.builtin.include_role:
            name: error-alert
    - name: 2 Task 2
      block:
        - name: 1-0 Task 1
          ansible.builtin.debug:
            msg: "Processing item: {{ item }}"
          # Converts the JSON string directly into a proper Ansible list
          loop: "{{ lookup('ansible.builtin.env', 'MY_LIST') | from_json }}"
      rescue:
        - name: 1F-0 Send failure alert
          ansible.builtin.include_role:
            name: error-alert
